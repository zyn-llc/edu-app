# =============================================================================
#  Topag'on LANDING — nginx site config (VPS host'da, konteynerda emas).
#
#  Bu fayl REKLAMA SAHIFASINI tarqatadi (`topagon.uz`).
#  Ilovaning o'zi endi `app.topagon.uz` da: deploy/nginx-app.conf.
#  API: deploy/nginx.conf (`api.topagon.uz`).
#
#  NEGA AJRATILDI. Ilgari `topagon.uz` to'g'ridan-to'g'ri Flutter Web'ni
#  ochardi. Odam domenga kirganda darhol bo'sh dashboard ko'rardi va ilova
#  nima qilishini tushunmasdi. Endi apex domen — sahifa, ilova esa alohida
#  subdomenda. Bu, shuningdek, ikkalasini mustaqil deploy qilish imkonini
#  beradi: sahifani o'zgartirish uchun Flutter build kerak emas.
#
#  Joylash:
#    sudo cp deploy/nginx-landing.conf /etc/nginx/sites-available/topagon-landing
#    sudo ln -sf /etc/nginx/sites-available/topagon-landing /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  Statika: /var/www/topagon-landing  (index.html, styles.css, main.js,
#           content.js, assets/)
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name topagon.uz www.topagon.uz;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://topagon.uz$request_uri; }
}

server {
    # `http2 on;` — nginx 1.25.1+ sintaksisi. Ubuntu 24.04 da 1.24 keladi.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.topagon.uz;

    ssl_certificate     /etc/letsencrypt/live/topagon.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/topagon.uz/privkey.pem;

    return 301 https://topagon.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name topagon.uz;

    root /var/www/topagon-landing;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/topagon.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/topagon.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript
               image/svg+xml application/manifest+json;

    # ---- KESHLASH ----------------------------------------------------------
    # Bu yerda Flutter emas, oddiy statik sahifa. Fayl nomlari hash'lanmagan,
    # shuning uchun uzoq `immutable` kesh XAVFLI: matnni tuzatsangiz, odamda
    # eskisi qolib ketadi. `must-revalidate` + ETag = 304, ya'ni tez, lekin
    # doim yangi.
    location = /index.html   { add_header Cache-Control "no-cache"; }
    location = /content.js   { add_header Cache-Control "no-cache"; }

    location ~* \.(css|js|svg|png|jpg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    location ~ /\. { deny all; }

    # SPA fallback KERAK EMAS: bu bitta sahifa, klient tomonda yo'naltirish
    # yo'q. Mavjud bo'lmagan yo'l — halol 404.
    location / { try_files $uri $uri/ =404; }

    access_log /var/log/nginx/topagon_landing_access.log;
    error_log  /var/log/nginx/topagon_landing_error.log warn;
}
