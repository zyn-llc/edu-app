# =============================================================================
#  Topag'on ILOVA (Flutter Web) — nginx site config.
#
#  Bu fayl FLUTTER WEB statikasini tarqatadi — endi `app.topagon.uz` da.
#  Apex domen (`topagon.uz`) reklama sahifasiga berildi: nginx-landing.conf.
#  API: nginx.conf (`api.topagon.uz`).
#
#  KO'CHIRISH HAQIDA (2026-08-06). Ilova ilgari `topagon.uz` da edi. Domen
#  o'zgargani uchun IKKI narsani yangilash SHART:
#    1. Web build'da havola domeni:
#         flutter build web --release \
#           --dart-define=API_BASE_URL=https://api.topagon.uz \
#           --dart-define=WEB_BASE_URL=https://app.topagon.uz
#       Aks holda bellashuv havolasi (`?join=KOD`) reklama sahifasiga olib
#       boradi va u yerda hech narsa bo'lmaydi.
#    2. Backend CORS: `.env` da CORS_ORIGINS=https://app.topagon.uz
#       (prod guard `*` ni qabul qilmaydi — server umuman ko'tarilmaydi).
#
#  Joylash:
#    sudo cp deploy/nginx-app.conf /etc/nginx/sites-available/topagon-app
#    sudo ln -sf /etc/nginx/sites-available/topagon-app /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  Sertifikat: avval faqat 80-blok bilan ko'tar, keyin
#    sudo certbot --nginx -d app.topagon.uz
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name app.topagon.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://app.topagon.uz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.topagon.uz;

    root /var/www/topagon-app;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/app.topagon.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.topagon.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # X-Frame-Options ATAYLAB yo'q emas — bor, lekin SAMEORIGIN:
    # Telegram Mini App kelajakda ilovani iframe'da ochishi mumkin, o'shanda
    # bu qatorni o'zgartirasan. Hozircha clickjacking'dan himoya muhimroq.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # CSP — XSS bo'lgan taqdirda zararni cheklaydi. Tokenlar `localStorage` da
    # turadi (token_store.dart izohiga qara), ya'ni sahifada bajarilgan begona
    # skript ularni o'qiy oladi; `connect-src` esa uni BOSHQA manzilga
    # yubora olmasligini ta'minlaydi.
    #
    # `'wasm-unsafe-eval'` MAJBURIY: Flutter Web CanvasKit'ni WebAssembly
    # sifatida yuklaydi va usiz sayt umuman ochilmaydi (bo'sh oq ekran).
    # `'unsafe-inline'` faqat `style-src` da: `web/index.html` dagi yuklanish
    # ekrani inline `<style>` bilan yozilgan.
    #
    # O'ZGARTIRGANDAN KEYIN brauzer konsolini TEKSHIR: CSP xatosi jim
    # bo'ladi — sayt shunchaki ochilmaydi va sabab faqat konsolda ko'rinadi.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' https://cdn.topagon.uz data: blob:; font-src 'self' data:; connect-src 'self' https://api.topagon.uz; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    server_tokens off;

    # Flutter Web `main.dart.js` ni gzip'da ~2-3 barobar kichraytiradi.
    # TAS-IX kanalida bu sezilarli farq.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml application/manifest+json;

    # Tayyor `.gz` bo'lsa — o'shani ber, qaytadan siqma.
    #
    # Birinchi tashrifda brauzer ~8 MB CanvasKit wasm va 3.8 MB
    # `main.dart.js` so'raydi. Ularni har so'rovda qaytadan siqish 2 yadroli
    # serverda bir necha soniya CPU degani, va bir vaqtda kirgan bir nechta
    # YANGI foydalanuvchi bir-birini kutib qoladi (eskilarida kesh bor, shu
    # sababli muammo faqat yangilarda ko'rinardi). `.gz` fayllar `deploy.sh`
    # da build vaqtida yaratiladi.
    #
    # Fayl topilmasa nginx yuqoridagi `gzip on` ga tushadi — ya'ni siqilgan
    # nusxa eskirsa yoki umuman bo'lmasa ham sayt ishlayveradi.
    gzip_static on;

    # CanvasKit `.wasm` — MIME turi `/etc/nginx/mime.types` da ALLAQACHON bor
    # (nginx 1.21+; Ubuntu 24.04 da 1.24). Bu yerda `types { ... }` yozma:
    # `types` bloki meros qilib olingan JADVALNI ALMASHTIRADI, qo'shmaydi.
    # Ya'ni bitta qator yozilsa, `.js` va `.css` uchun MIME yo'qoladi va
    # ular `text/plain` bo'lib qaytadi. Yuqorida `nosniff` turgani uchun
    # brauzer `main.dart.js` ni ishga tushirishdan BOSH TORTADI — sayt
    # umuman ochilmaydi (bo'sh oq ekran).

    # ---- KESHLASH ----------------------------------------------------------
    # MUHIM: Flutter Web chiqishida fayl nomlari HASH'LANMAGAN
    # (`main.dart.js` har build'da bir xil nom bilan chiqadi). Shu sababli
    # uzoq muddatli `immutable` kesh XAVFLI — foydalanuvchida eski ilova
    # qotib qolib, yangi API bilan mos kelmay qoladi.
    #
    # Yagona istisno — `canvaskit/`: uning yo'li Flutter versiyasiga bog'liq,
    # ya'ni amalda o'zgarmas.

    # Ilova qobig'i va versiya fayllari — HECH QACHON keshlanmaydi.
    location = /index.html               { add_header Cache-Control "no-store"; }
    location = /flutter_bootstrap.js     { add_header Cache-Control "no-store"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-store"; }
    location = /version.json             { add_header Cache-Control "no-store"; }
    location = /manifest.json            { add_header Cache-Control "no-cache"; }

    location /canvaskit/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Qolgan statikaning hammasi: keshlanadi, lekin har safar tekshiriladi.
    # `must-revalidate` + ETag = tarmoqda 304, ya'ni tez, lekin eskirmaydi.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|otf|wav|mp3|json)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    # Yashirin fayllar (.env, .git) — hech qachon.
    location ~ /\. { deny all; }

    # ---- SPA fallback -------------------------------------------------------
    # Flutter Web klient tomonda yo'naltiradi. `/leaderboard` ga to'g'ridan
    # kirilganda diskda bunday fayl yo'q — `index.html` qaytarilishi kerak,
    # aks holda 404. `=404` emas, aynan `/index.html`.
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/topagon_app_access.log;
    error_log  /var/log/nginx/topagon_app_error.log warn;
}
