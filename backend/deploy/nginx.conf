# =============================================================================
#  Bilim API — nginx site config (VPS host'da, konteynerda emas).
#
#  Joylash:
#    sudo cp deploy/nginx.conf /etc/nginx/sites-available/bilim
#    sudo ln -s /etc/nginx/sites-available/bilim /etc/nginx/sites-enabled/bilim
#    sudo rm -f /etc/nginx/sites-enabled/default
#    sudo cp deploy/proxy_params_bilim /etc/nginx/proxy_params_bilim
#
#  DOMEN: quyidagi __DOMAIN__ ni haqiqiy domenga almashtir:
#    sudo sed -i 's/__DOMAIN__/api.SENING-DOMENING.uz/g' /etc/nginx/sites-available/bilim
#
#  Sertifikat: avval faqat 80-port blokini qoldirib nginx'ni ko'tarasan, keyin
#    sudo certbot --nginx -d api.SENING-DOMENING.uz
#  certbot 443 blokini o'zi to'ldiradi; quyidagi 443 bloki uning natijasiga mos.
# =============================================================================

# ---- rate limit zonalari (http kontekstida bo'lishi kerak) -------------------
# Bu fayl sites-available'da bo'lgani uchun limit_req_zone http{} ichiga
# tushadi — Ubuntu'da nginx.conf sites-enabled'ni http{} ichida include qiladi.
#
# otp: SMS pul turadi. Serverdagi ikkinchi mudofaa chizig'i (birinchisi —
#      ilovadagi OTP_IP_HOURLY_CAP).
# api: umumiy suiiste'moldan. Anti-scraping asosiy ishini app/core/antiabuse.py
#      qiladi; bu shunchaki qo'pol ustki chegara.
limit_req_zone $binary_remote_addr zone=bilim_otp:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=bilim_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=bilim_conn:10m;

# ---- HTTP: faqat HTTPS'ga yo'naltirish + certbot challenge ------------------
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ------------------------------------------------------------------
server {
    # `http2 on;` ATAYLAB ishlatilmagan: u nginx 1.25.1+ sintaksisi, Ubuntu
    # 24.04 esa 1.24 bilan keladi va "unknown directive http2" bilan yiqiladi.
    # `listen ... http2` eski shakli 1.25+ da ham ishlaydi.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: brauzer bu domenga boshqa HTTP orqali bormaydi.
    # DIQQAT: bir marta yuborilgach 6 oy orqaga qaytarib bo'lmaydi.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Server nomi/versiyasini bermaslik.
    server_tokens off;

    # Savol matnlari katta emas; 1 MB dan katta body faqat hujum bo'lishi mumkin.
    client_max_body_size 1m;
    client_body_timeout 15s;

    limit_conn bilim_conn 40;

    # Zaxira nusxa yoki .env kabi fayllarni so'rash urinishlari — darrov 404.
    location ~ /\. { deny all; }

    # ---- OTP: eng qattiq cheklov -------------------------------------------
    location /v1/auth/otp {
        limit_req zone=bilim_otp burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params_bilim;
        proxy_pass http://127.0.0.1:8000;
    }

    # ---- Admin: FAQAT sening IP'ingdan --------------------------------------
    #
    # X-Admin-Key ikkinchi qatlam, bu esa BIRINCHISI. Ilgari ikkala qator ham
    # izohda turardi, ya'ni butun admin yuzasi (barcha murojaatlar, aloqa
    # ma'lumotlari, retention va referral grafigi) internetdan bitta statik
    # satr bilan himoyalangan edi.
    #
    # Deploy paytida O'Z IP'INGNI yoz:
    #   sudo sed -i 's/__ADMIN_IP__/213.xxx.xxx.xxx/' /etc/nginx/sites-available/bilim
    #
    # Dinamik IP bo'lsa — VPN/WireGuard manzilini yoz. Ikkalasi ham
    # bo'lmasa, `allow all;` qilib faqat kalitga tayanish MUMKIN, lekin
    # o'shanda kalit `openssl rand -hex 24` bo'lishi shart.
    location /v1/admin/ {
        allow 127.0.0.1;
        allow __ADMIN_IP__;
        deny all;
        limit_req zone=bilim_otp burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params_bilim;
        proxy_pass http://127.0.0.1:8000;
    }

    # ---- /docs: prod'da yopiq ----------------------------------------------
    # OpenAPI sxemasi butun API yuzasini ochib beradi. Kerak bo'lsa vaqtincha
    # izohga ol.
    location ~ ^/(docs|redoc|openapi\.json) {
        return 404;
    }

    # ---- qolgan hammasi -----------------------------------------------------
    location / {
        limit_req zone=bilim_api burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params_bilim;
        proxy_pass http://127.0.0.1:8000;
    }

    access_log /var/log/nginx/bilim_access.log;
    error_log  /var/log/nginx/bilim_error.log warn;
}
