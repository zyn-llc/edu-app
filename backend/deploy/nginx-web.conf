# =============================================================================
#  ⛔ ESKIRGAN — ISHLATMA. Saqlanib turibdi, chunki eski o'rnatishlarda shu
#     fayl bilan sozlangan sayt bo'lishi mumkin.
#
#  2026-08-06 dan boshlab ilova `app.topagon.uz` da, apex domen esa reklama
#  sahifasi. To'g'ri fayllar:
#      deploy/nginx-app.conf      — ilova (app.topagon.uz)
#      deploy/nginx-landing.conf  — reklama sahifasi (topagon.uz)
#      deploy/nginx.conf          — API (api.topagon.uz)
#
#  Bu faylni ishlatsang, apex domen ilovani ochadi va `CORS_ORIGINS` ham,
#  `WEB_BASE_URL` ham mos kelmay qoladi.
# =============================================================================

# =============================================================================
#  (eski) Topag'on Web — nginx site config (VPS host'da, konteynerda emas).
#
#  Bu fayl FLUTTER WEB statikasini tarqatadi (`topagon.uz`).
#  API uchun alohida fayl bor: deploy/nginx.conf (`api.topagon.uz`).
#
#  Joylash:
#    sudo cp deploy/nginx-web.conf /etc/nginx/sites-available/topagon-web
#    sudo sed -i 's/__DOMAIN__/topagon.uz/g' /etc/nginx/sites-available/topagon-web
#    sudo ln -sf /etc/nginx/sites-available/topagon-web /etc/nginx/sites-enabled/topagon-web
#    sudo nginx -t && sudo systemctl reload nginx
#
#  Statikani joylash:
#    # Windows'da:
#    flutter build web --release --dart-define=API_BASE_URL=https://api.topagon.uz
#    scp -r build\web\* topagon@VPS_IP:/var/www/topagon/
#    # VPS'da:
#    sudo chown -R www-data:www-data /var/www/topagon
#
#  Sertifikat: avval faqat 80-blok bilan ko'tar, keyin
#    sudo certbot --nginx -d topagon.uz -d www.topagon.uz
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

server {
    # `http2 on;` — nginx 1.25.1+ sintaksisi. Ubuntu 24.04 da 1.24 keladi va
    # "unknown directive" bilan yiqiladi. Eski shakl ikkalasida ham ishlaydi.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # www → apex. Bitta kanonik manzil bo'lsin: PWA `start_url` va service
    # worker domenga bog'langan, ikki domenda ikki xil kesh paydo bo'ladi.
    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    root /var/www/topagon;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # X-Frame-Options ATAYLAB yo'q emas — bor, lekin SAMEORIGIN:
    # Telegram Mini App kelajakda ilovani iframe'da ochishi mumkin, o'shanda
    # bu qatorni o'zgartirasan. Hozircha clickjacking'dan himoya muhimroq.
    add_header X-Frame-Options "SAMEORIGIN" always;
    server_tokens off;

    # Flutter Web `main.dart.js` ni gzip'da ~2-3 barobar kichraytiradi.
    # TAS-IX kanalida bu sezilarli farq.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml application/manifest+json;

    # Tayyor `.gz` bo'lsa — o'shani ber, qaytadan siqma. Sabab va tafsilotlar
    # `nginx-app.conf` da; qisqasi: ~8 MB wasm ni har yangi tashrifda
    # qaytadan siqish 2 yadroli serverda navbat hosil qiladi. Fayl topilmasa
    # nginx yuqoridagi `gzip on` ga tushadi.
    gzip_static on;

    # CanvasKit `.wasm` — MIME turi `/etc/nginx/mime.types` da ALLAQACHON bor
    # (nginx 1.21+; Ubuntu 24.04 da 1.24). Bu yerda `types { ... }` yozma:
    # `types` bloki meros qilib olingan JADVALNI ALMASHTIRADI, qo'shmaydi.
    # Ya'ni bitta qator yozilsa, `.js` va `.css` uchun MIME yo'qoladi va
    # ular `text/plain` bo'lib qaytadi. Yuqorida `nosniff` turgani uchun
    # brauzer `main.dart.js` ni ishga tushirishdan BOSH TORTADI — sayt
    # umuman ochilmaydi (bo'sh oq ekran).

    # ---- KESHLASH ----------------------------------------------------------
    # MUHIM: Flutter Web chiqishida fayl nomlari HASH'LANMAGAN
    # (`main.dart.js` har build'da bir xil nom bilan chiqadi). Shu sababli
    # uzoq muddatli `immutable` kesh XAVFLI — foydalanuvchida eski ilova
    # qotib qolib, yangi API bilan mos kelmay qoladi.
    #
    # Yagona istisno — `canvaskit/`: uning yo'li Flutter versiyasiga bog'liq,
    # ya'ni amalda o'zgarmas.

    # Ilova qobig'i va versiya fayllari — HECH QACHON keshlanmaydi.
    location = /index.html               { add_header Cache-Control "no-store"; }
    location = /flutter_bootstrap.js     { add_header Cache-Control "no-store"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-store"; }
    location = /version.json             { add_header Cache-Control "no-store"; }
    location = /manifest.json            { add_header Cache-Control "no-cache"; }

    location /canvaskit/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Qolgan statikaning hammasi: keshlanadi, lekin har safar tekshiriladi.
    # `must-revalidate` + ETag = tarmoqda 304, ya'ni tez, lekin eskirmaydi.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|otf|wav|mp3|json)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    # Yashirin fayllar (.env, .git) — hech qachon.
    location ~ /\. { deny all; }

    # ---- SPA fallback -------------------------------------------------------
    # Flutter Web klient tomonda yo'naltiradi. `/leaderboard` ga to'g'ridan
    # kirilganda diskda bunday fayl yo'q — `index.html` qaytarilishi kerak,
    # aks holda 404. `=404` emas, aynan `/index.html`.
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/topagon_web_access.log;
    error_log  /var/log/nginx/topagon_web_error.log warn;
}
